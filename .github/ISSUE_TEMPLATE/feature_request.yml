name: Feature request
description: Suggest an idea for this project
labels: ["enhancement"]
body:
  - type: textarea
    id: feature-description
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is. Ex. I'm always frustrated when [...]
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the feature request here.
  - type: dropdown
    id: impact-area
    attributes:
      label: Primary impact area
      options:
        - router/safety/actions
        - runtime/api
        - training/model-registry
        - tools/adapters
        - docs/devex
    validations:
      required: true
  - type: textarea
    id: safety-rollout
    attributes:
      label: Safety and rollout plan
      description: Describe confirmation policy, dry-run behavior, and staged rollout expectations.
  - type: checkboxes
    id: acceptance
    attributes:
      label: Acceptance expectations
      options:
        - label: Includes test plan (unit first, broader non-integration as needed).
          required: true
        - label: Includes docs update plan for user-visible/config changes.
          required: true
