name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      replay_gate: ${{ steps.filter.outputs.replay_gate }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          replay_gate:
            - 'router/**'
            - 'safety/**'
            - 'scripts/replay_audit.py'
            - 'tests/test_audit_replay.py'
            - 'tests/fixtures/replay/**'
            - '.github/workflows/ci.yml'

  test:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip install -r dev-requirements.txt
    - name: Run unit tests
      run: |
        python -m pytest tests -m unit -q --disable-warnings
    - name: Run non-integration tests
      run: |
        python -m pytest tests -q --disable-warnings --ignore=tests/integration

  replay-gate:
    needs: changes
    if: needs.changes.outputs.replay_gate == 'true'
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip install -r dev-requirements.txt
    - name: Run strict replay gate
      run: |
        python scripts/replay_audit.py --input tests/fixtures/replay/strict_pass.jsonl --output temp/benchmarks/ci_replay_report.json --strict
