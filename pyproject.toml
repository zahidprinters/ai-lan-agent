[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-lan"
version = "0.3.0"
description = "Character-level language modeling toolkit with training, inference, and deployment pipelines."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Nadeem Abbas" },
]

[project.optional-dependencies]
experiment = [
  "wandb==0.17.0",
  "mlflow==2.13.0",
]
phase4 = [
  "playwright==1.58.0",
  "tavily-python==0.7.23",
]
vision = [
  "mss==10.1.0",
  "pytesseract==0.3.13",
  "Pillow==12.2.0",
]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider --basetemp=temp/pytest"
markers = [
  "unit: fast checks for small isolated components",
  "integration: slower end-to-end workflow checks",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
cache_dir = "temp/mypy_cache"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
  "training.models.*",
  "training.inference",
  "training.checkpoints",
  "training.config",
  "training.factory",
]
ignore_errors = true

