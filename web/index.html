<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta
    name="description"
    content="Local AI Lan dashboard for chat, runs, models, memory, logs, context, and ops."
  />
  <title>AI Lan Dashboard</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/css/app.css" />
  <script defer src="/assets/js/app.js"></script>
</head>
<body>
  <div class="bg-orb bg-orb--one" aria-hidden="true"></div>
  <div class="bg-orb bg-orb--two" aria-hidden="true"></div>
  <div class="bg-grid" aria-hidden="true"></div>

  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="/overview" data-nav="overview" aria-label="AI Lan home">
        <span class="brand-mark">
          <svg class="icon icon--brand" aria-hidden="true"><use href="/assets/icons.svg#logo"></use></svg>
        </span>
        <span class="brand-copy">
          <strong>AI Lan</strong>
          <span>Local dashboard</span>
        </span>
      </a>

      <nav class="nav" aria-label="Primary">
        <a href="/overview" data-nav="overview">
          <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#overview"></use></svg>
          <span>Overview</span>
        </a>
        <a href="/chat" data-nav="chat">
          <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#chat"></use></svg>
          <span>Chat</span>
        </a>
        <a href="/runs" data-nav="runs">
          <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#runs"></use></svg>
          <span>Runs</span>
        </a>
        <a href="/models" data-nav="models">
          <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#models"></use></svg>
          <span>Models</span>
        </a>
        <a href="/memory" data-nav="memory">
          <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#memory"></use></svg>
          <span>Memory</span>
        </a>
        <a href="/context" data-nav="context">
          <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#context"></use></svg>
          <span>Context</span>
        </a>
        <a href="/logs" data-nav="logs">
          <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#logs"></use></svg>
          <span>Logs</span>
        </a>
        <a href="/ops" data-nav="ops">
          <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#ops"></use></svg>
          <span>Ops</span>
        </a>
      </nav>

      <form class="searchbar" id="global-search" autocomplete="off">
        <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#search"></use></svg>
        <input
          id="global-query"
          name="query"
          type="search"
          placeholder="Search memory, context, or runs"
          aria-label="Search memory, context, or runs"
        />
        <button type="submit" class="btn btn--ghost">
          <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#refresh"></use></svg>
          <span>Go</span>
        </button>
      </form>
    </header>

    <main class="main">
      <section id="route-meta" class="route-meta"></section>
      <section id="view" class="view"></section>
    </main>
  </div>

  <noscript>
    <div class="noscript">
      This dashboard needs JavaScript to render the local subpages and live data panels.
    </div>
  </noscript>
</body>
</html>
